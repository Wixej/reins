name: Build Reins APK (v1.3.4 FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.3.4
        uses: actions/checkout@v4
        with:
          ref: v1.3.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean
        run: flutter clean

      # 🔥 Жёстко фиксируем всё сразу
      - name: Fix dependencies
        run: |
          sed -i 's/environment:.*/environment:\n  sdk: ">=3.0.0 <4.0.0"/' pubspec.yaml
          sed -i 's/google_fonts: .*/google_fonts: 6.1.0/' pubspec.yaml
          sed -i 's/http: .*/http: 1.2.2/' pubspec.yaml
          sed -i 's/flutter_svg: .*/flutter_svg: 2.0.10/' pubspec.yaml

      # 🔥 фикс кода под новые пакеты
      - name: Fix code
        run: |
          grep -rl "kodeMono" lib | xargs sed -i 's/kodeMono/robotoMono/g' || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reins-apk
          path: build/app/outputs/flutter-apk/app-release.apk
