name: Build Reins APK (v1.3.4)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout v1.3.4
        uses: actions/checkout@v4
        with:
          ref: v1.3.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Doctor
        run: flutter doctor

      - name: Clean project
        run: flutter clean

      # 🔥 ФИКС google_fonts (ключевой)
      - name: Fix dependencies
        run: |
          sed -i 's/google_fonts: .*/google_fonts: 4.0.4/' pubspec.yaml
          sed -i 's/http: .*/http: 0.13.6/' pubspec.yaml
          sed -i 's/flutter_svg: .*/flutter_svg: 2.0.9/' pubspec.yaml
          grep -rl "kodeMono" lib | xargs sed -i 's/kodeMono/robotoMono/g'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reins-apk
          path: build/app/outputs/flutter-apk/app-release.apk
